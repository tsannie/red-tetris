version: '3.9'

services:
  front:
    profiles: ['dev']
    build:
      context: ./client
    ports:
      - '5173:5173'
    volumes:
      - ./client:/app
    environment:
      - NODE_ENV=development

  back:
    profiles: ['dev']
    build:
      context: ./server
    ports:
      - '4000:4000'
    volumes:
      - ./server:/app
    environment:
      - NODE_ENV=development

  app:
    profiles: ['prod']
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - '4000:4000'
    environment:
      - NODE_ENV=production
