version: '3.9'

services:
  client:
    build:
      context: ./client
      target: development
    ports:
      - '5173:5173'
    volumes:
      - ./client:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
    profiles: ['dev']

  client-prod:
    build:
      context: ./client
      target: production
    ports:
      - '4173:4173'
    environment:
      - NODE_ENV=production
    profiles: ['prod']

  back:
    build:
      context: ./server
      target: development
    ports:
      - '4000:4000'
    volumes:
      - ./server:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
    profiles: ['dev']

  back-prod:
    build:
      context: ./server
      target: production
    expose:
      - '4000'
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:4000/health']
      interval: 5s
      timeout: 2s
      retries: 3
    profiles: ['prod']

  nginx:
    image: nginx:alpine
    ports:
      - '8080:80'
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - client-prod
      - back-prod
    profiles: ['prod']
